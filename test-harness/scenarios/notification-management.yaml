name: notification-management
description: Notification sending, queue processing, retry, and cancellation
module: notification
legacy_package: PKG_NOTIFICATION
modern_endpoint: /api/notifications

steps:
  # ---------------------------------------------------------------
  # send_notification — manual notification
  # ---------------------------------------------------------------
  - name: Send an email notification
    action: send_notification
    input:
      recipient_emp_id: 34
      notification_type: "EMAIL"
      subject: "Test Notification"
      body: "This is a test notification from the equivalence harness."
      priority: "NORMAL"
    expect:
      status: "QUEUED"
      notification_type: "EMAIL"
    save_as: email_notification

  - name: Send an in-app notification
    action: send_notification
    input:
      recipient_emp_id: 34
      notification_type: "IN_APP"
      subject: "Leave Request Approved"
      body: "Your leave request for Aug 12-16 has been approved."
      priority: "HIGH"
    expect:
      status: "QUEUED"
      notification_type: "IN_APP"
    save_as: inapp_notification

  # ---------------------------------------------------------------
  # process_queue — batch notification processing
  # ---------------------------------------------------------------
  - name: Process notification queue
    action: process_queue
    input:
      batch_size: 100
    expect:
      processed_count: ">= 1"
      failed_count: ">= 0"
    save_as: queue_result

  # ---------------------------------------------------------------
  # Verify notification was sent
  # ---------------------------------------------------------------
  - name: Get notification status after processing
    action: get_notification_status
    input:
      notification_id: "{{email_notification.notification_id}}"
    expect:
      status: "SENT"

  # ---------------------------------------------------------------
  # retry_failed — retry failed notifications
  # ---------------------------------------------------------------
  - name: Retry failed notifications
    action: retry_failed
    input:
      max_retries: 3
    expect:
      retried_count: ">= 0"

  # ---------------------------------------------------------------
  # cancel_notification — cancel a queued notification
  # ---------------------------------------------------------------
  - name: Send a notification to be cancelled
    action: send_notification
    input:
      recipient_emp_id: 35
      notification_type: "EMAIL"
      subject: "To Be Cancelled"
      body: "This notification should be cancelled before processing."
      priority: "LOW"
    expect:
      status: "QUEUED"
    save_as: cancel_notification

  - name: Cancel the queued notification
    action: cancel_notification
    input:
      notification_id: "{{cancel_notification.notification_id}}"
      reason: "Sent in error"
    expect:
      status: "CANCELLED"

  # ---------------------------------------------------------------
  # Negative: Cancel already-sent notification
  # ---------------------------------------------------------------
  - name: Attempt to cancel an already-sent notification
    action: cancel_notification
    input:
      notification_id: "{{email_notification.notification_id}}"
      reason: "Too late"
    expect:
      error: true
      error_message: "*Cannot cancel notification that has already been sent*"

  # ---------------------------------------------------------------
  # Negative: Send to non-existent employee
  # ---------------------------------------------------------------
  - name: Send notification to non-existent employee
    action: send_notification
    input:
      recipient_emp_id: 99999
      notification_type: "EMAIL"
      subject: "Invalid Recipient"
      body: "Should fail."
      priority: "NORMAL"
    expect:
      error: true
      error_message: "*Recipient employee not found*"

  # ---------------------------------------------------------------
  # Notification side-effects — verify notifications generated by other operations
  # ---------------------------------------------------------------
  - name: Get notifications generated for employee by event type
    action: get_notifications_by_event
    input:
      emp_id: 34
      event_type: "LEAVE_APPROVED"
      date_from: "2024-01-01"
      date_to: "2024-12-31"
    expect:
      count: ">= 0"

  - name: Get notifications generated for termination events
    action: get_notifications_by_event
    input:
      emp_id: 34
      event_type: "EMPLOYEE_TERMINATED"
      date_from: "2024-01-01"
      date_to: "2024-12-31"
    expect:
      count: ">= 0"
